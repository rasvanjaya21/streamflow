name: Auto Release

on:
    pull_request:
        types:
            - closed
        branches:
            - master

permissions:
    contents: write

jobs:
    release:
        if: github.event.pull_request.merged == true
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Get version from merge commit message
              id: get_version
              run: |
                  MERGE_SHA="${{ github.event.pull_request.merge_commit_sha }}"
                  if [ -z "$MERGE_SHA" ]; then
                    exit 1
                  fi
                  COMMIT_MSG=$(git log -1 --pretty=%B "$MERGE_SHA")
                  echo "Commit message:"
                  echo "$COMMIT_MSG"
                  VERSION=$(echo "$COMMIT_MSG" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')
                  if [ -z "$VERSION" ]; then
                    exit 1
                  fi
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

            - name: Check if tag exists
              id: check_tag
              run: |
                  if git ls-remote --tags origin | grep -q "refs/tags/${{ steps.get_version.outputs.version }}"; then
                    echo "exists=true" >> $GITHUB_OUTPUT
                  else
                    echo "exists=false" >> $GITHUB_OUTPUT
                  fi

            - name: Create git tag
              if: steps.check_tag.outputs.exists == 'false'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag -a "${{ steps.get_version.outputs.version }}" -m "${{ steps.get_version.outputs.version }}"
                  git push origin "${{ steps.get_version.outputs.version }}"

            - name: Create github release
              if: steps.check_tag.outputs.exists == 'false'
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.get_version.outputs.version }}
                  name: ${{ steps.get_version.outputs.version }}
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
